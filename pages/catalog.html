<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catálogo | SeguriCampus</title><link rel="stylesheet" href="../css/styles.css"><link rel="stylesheet" href="../css/responsive.css"></head><body><header class="navbar"><a class="brand" href="../index.html">SeguriCampus</a><nav><a href="dashboard.html">Mi panel</a></nav></header><main class="container"><h1 class="page-title">Catálogo de cursos</h1><p class="muted">Encuentra formación según tus necesidades.</p><div class="grid" id="courses"></div></main><script src="../js/courses.js"></script><script>courses.innerHTML=SeguriCourses.map(c=>`<article class="card"><h3>${c.title}</h3><p class="muted">Nivel ${c.level}</p><div><progress value="${c.progress}" max="100"></progress> ${c.progress}%</div><p><a class="btn" href="course.html?id=${c.id}">Ver curso</a></p></article>`).join('');</script></body></html>
