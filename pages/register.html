<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registro | SeguriCampus</title><link rel="stylesheet" href="../css/styles.css"><link rel="stylesheet" href="../css/responsive.css"></head><body><header class="navbar"><a class="brand" href="../index.html">SeguriCampus</a><nav><a href="login.html">Iniciar sesión</a></nav></header><main class="auth-layout"><section class="card auth-card"><h1>Crear cuenta</h1><form id="registerForm"><label>Nombre completo</label><input id="name" required><label>Correo electrónico</label><input id="email" type="email" required><label>Rol</label><select id="role"><option>Estudiante</option><option>Docente</option><option>Administrador</option></select><label>Contraseña</label><input id="password" type="password" minlength="6" required><button class="btn" type="submit">Registrarme</button></form></section></main><script src="../js/config.js"></script><script src="../js/auth.js"></script><script>document.getElementById('registerForm').onsubmit=e=>{e.preventDefault();SeguriAuth.register({name:name.value,email:email.value,role:role.value});SeguriAuth.session(role.value.toLowerCase());location.href='dashboard.html'};</script></body></html>
