<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iniciar sesión | SeguriCampus</title><link rel="stylesheet" href="../css/styles.css"><link rel="stylesheet" href="../css/responsive.css"></head>
<body><header class="navbar"><a class="brand" href="../index.html">SeguriCampus</a><nav><a href="register.html">Crear cuenta</a></nav></header><main class="auth-layout"><section class="card auth-card"><h1>Iniciar sesión</h1><p class="muted">Accede a tu campus.</p><form id="loginForm"><label for="email">Correo electrónico</label><input id="email" type="email" required placeholder="nombre@institucion.edu"><label for="password">Contraseña</label><input id="password" type="password" required><button class="btn" type="submit">Ingresar</button></form><p><a href="forgot-password.html">¿Olvidaste tu contraseña?</a></p></section></main><script src="../js/config.js"></script><script src="../js/auth.js"></script><script src="../js/navigation.js"></script><script>document.getElementById('loginForm').onsubmit=e=>{e.preventDefault();if(window.SeguriAuth.login(email.value,password.value)){SeguriAuth.session('student');location.href='dashboard.html'}};</script></body></html>
